services:
  postgres:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: agentproof
      POSTGRES_PASSWORD: agentproof
      POSTGRES_DB: agentproof
    ports: ["127.0.0.1:${AGENTPROOF_DB_PORT:-55432}:5432"]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./infra/init-test-db.sql:/docker-entrypoint-initdb.d/test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentproof"]
      interval: 2s
      timeout: 3s
      retries: 30
  temporal-volume:
    image: temporalio/temporal:1.9.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /data && chown 1000:1000 /data"]
    volumes: ["temporal:/data"]
  temporal:
    depends_on:
      temporal-volume: {condition: service_completed_successfully}
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports: ["127.0.0.1:${AGENTPROOF_TEMPORAL_PORT:-7233}:7233", "127.0.0.1:${AGENTPROOF_TEMPORAL_UI_PORT:-8233}:8233"]
    volumes: ["temporal:/data"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 2s
      timeout: 5s
      retries: 60
  temporal-namespace:
    image: temporalio/temporal:1.9.1
    depends_on:
      temporal: {condition: service_healthy}
    command: ["operator", "namespace", "update", "--address", "temporal:7233", "--namespace", "default", "--retention", "168h"]
  jaeger-volume:
    image: postgres:16.14-alpine
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /storage/key /storage/data && chown -R 10001:10001 /storage"]
    volumes: ["jaeger:/storage"]
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    depends_on:
      jaeger-volume: {condition: service_completed_successfully}
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_KEY: /storage/key
      BADGER_DIRECTORY_VALUE: /storage/data
      BADGER_SPAN_STORE_TTL: 168h
    ports: ["127.0.0.1:${AGENTPROOF_JAEGER_PORT:-16686}:16686", "127.0.0.1:${AGENTPROOF_OTLP_PORT:-4318}:4318"]
    volumes: ["jaeger:/storage"]
  otel-queue-volume:
    image: postgres:16.14-alpine
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /var/lib/otelcol/queue && chown -R 10001:10001 /var/lib/otelcol"]
    volumes: ["otel-queue:/var/lib/otelcol"]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: ["--config=/etc/otelcol/collector.yaml"]
    depends_on:
      jaeger: {condition: service_started}
      otel-queue-volume: {condition: service_completed_successfully}
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol/collector.yaml:ro
      - otel-queue:/var/lib/otelcol
    ports: ["127.0.0.1:${AGENTPROOF_COLLECTOR_PORT:-4320}:4318"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol/collector.yaml"]
      interval: 10s
      timeout: 5s
      retries: 3
  migrate:
    build: {context: ., dockerfile: Dockerfile.dev, target: api}
    command: ["/api-migrate"]
    environment:
      DATABASE_URL: postgresql://agentproof:agentproof@postgres:5432/agentproof
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: Dockerfile.dev, target: api}
    environment:
      DATABASE_URL: postgresql://agentproof_runtime:agentproof_runtime_local_only@postgres:5432/agentproof
      AGENTPROOF_MIGRATIONS_EXTERNAL: "1"
      TEMPORAL_ADDRESS: temporal:7233
      AGENTPROOF_TASK_QUEUE: ${AGENTPROOF_TASK_QUEUE:-agentproof-v1}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      AGENTPROOF_API_TOKEN: ${AGENTPROOF_API_TOKEN:?Set AGENTPROOF_API_TOKEN to a random local secret}
    ports: ["127.0.0.1:${AGENTPROOF_API_PORT:-8080}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      temporal: {condition: service_healthy}
      temporal-namespace: {condition: service_completed_successfully}
      jaeger: {condition: service_started}
      otel-collector: {condition: service_started}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -H "Authorization: Bearer $$AGENTPROOF_API_TOKEN"
          http://localhost:8080/healthz
      interval: 2s
      timeout: 5s
      retries: 60
  worker:
    build: {context: ., dockerfile: Dockerfile.dev, target: worker}
    environment:
      DATABASE_URL: postgresql://agentproof_runtime:agentproof_runtime_local_only@postgres:5432/agentproof
      TEMPORAL_ADDRESS: temporal:7233
      AGENTPROOF_TASK_QUEUE: ${AGENTPROOF_TASK_QUEUE:-agentproof-v1}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      api: {condition: service_healthy}
  web:
    build: {context: ., dockerfile: Dockerfile.dev, target: web}
    environment:
      API_PROXY_TARGET: http://api:8080
      AGENTPROOF_API_TOKEN: ${AGENTPROOF_API_TOKEN:?Set AGENTPROOF_API_TOKEN to a random local secret}
    ports: ["127.0.0.1:${AGENTPROOF_WEB_PORT:-5173}:5173"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 60
  verify:
    profiles: [verification]
    build: {context: ., dockerfile: Dockerfile.dev, target: verify}
    environment:
      DATABASE_URL: postgresql://agentproof_runtime:agentproof_runtime_local_only@postgres:5432/agentproof
      TEMPORAL_ADDRESS: temporal:7233
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      AGENTPROOF_API_TOKEN: ${AGENTPROOF_API_TOKEN:?Set AGENTPROOF_API_TOKEN to a random local secret}
      TEST_DATABASE_URL: postgresql://agentproof:agentproof@postgres:5432/agentproof_test
      TEST_TEMPORAL_ADDRESS: temporal:7233
      E2E_BASE_URL: http://web:5173
      JAEGER_QUERY_URL: http://jaeger:16686
      EVIDENCE_DIR: /evidence
    volumes: ["./.local/verification:/evidence"]
    depends_on:
      web: {condition: service_healthy}
      worker: {condition: service_started}

volumes:
  postgres:
  temporal:
  jaeger:
  otel-queue:
