name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p .local/verification
      - run: docker compose up -d --build --wait
      - run: docker compose --profile verification build verify
      - run: docker compose --profile verification run --rm verify
      - if: always()
        run: docker compose logs --no-color > .local/verification/docker.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: verification-evidence, path: .local/verification/}
