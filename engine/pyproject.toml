[project]
name = "agentproof-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.12,<3", "pydantic-ai-slim[openai]>=1.107.9,<2",
  "temporalio[opentelemetry]>=1.20,<2", "psycopg[binary]>=3.2,<4",
  "opentelemetry-sdk>=1.38,<2", "opentelemetry-exporter-otlp-proto-http>=1.38,<2"
]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "jsonschema>=4,<5",
    "hypothesis>=6.150,<7",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["agentproof"]
